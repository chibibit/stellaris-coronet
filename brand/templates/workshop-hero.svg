<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
  <!--
    Workshop hero image template, rendered at 1920x1080 by scripts/brand.sh. Upload it as the first
    screenshot of the Workshop item, and use it as the header image of the description.
    Placeholders: {{MARK}}, {{SUBTITLE}}, {{TAGLINE}}, {{VERSION}}.
  -->
  <defs>
    <linearGradient id="crn-h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182148"/>
      <stop offset="0.55" stop-color="#0E1224"/>
      <stop offset="1" stop-color="#080A14"/>
    </linearGradient>
    <radialGradient id="crn-h-nebula-a" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2A3A84" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2A3A84" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crn-h-nebula-b" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1E2A5E" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1E2A5E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crn-h-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F0C75E" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#D6AC40" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#D6AC40" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crn-h-vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="crn-h-text" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feComponentTransfer in="blur" result="glow"><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crn-h-star" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#crn-h-bg)"/>
  <!-- nebula haze -->
  <ellipse cx="520" cy="540" rx="900" ry="620" fill="url(#crn-h-nebula-a)"/>
  <ellipse cx="1520" cy="240" rx="760" ry="420" fill="url(#crn-h-nebula-b)"/>
  <ellipse cx="1400" cy="920" rx="800" ry="360" fill="url(#crn-h-nebula-b)"/>
  <g fill="#F4F1EA" filter="url(#crn-h-star)">
    <circle cx="120" cy="140" r="1.8" opacity="0.65"/>
    <circle cx="300" cy="80" r="1.3" opacity="0.55"/>
    <circle cx="820" cy="120" r="1.5" opacity="0.55"/>
    <circle cx="1500" cy="90" r="1.7" opacity="0.65"/>
    <circle cx="1780" cy="220" r="1.2" opacity="0.55"/>
    <circle cx="1650" cy="900" r="1.6" opacity="0.55"/>
    <circle cx="1100" cy="980" r="1.3" opacity="0.45"/>
    <circle cx="200" cy="960" r="1.5" opacity="0.55"/>
    <circle cx="90" cy="600" r="1.1" opacity="0.45"/>
    <circle cx="1840" cy="560" r="1.4" opacity="0.55"/>
    <circle cx="1300" cy="420" r="1" opacity="0.4"/>
    <circle cx="700" cy="860" r="1.1" opacity="0.45"/>
    <circle cx="960" cy="300" r="2.2" opacity="0.8"/>
    <circle cx="1720" cy="740" r="1.9" opacity="0.75"/>
    <circle cx="380" cy="880" r="2" opacity="0.75"/>
    <circle cx="1180" cy="760" r="1.6" opacity="0.6"/>
  </g>
  <!-- gold halo behind the mark -->
  <circle cx="560" cy="540" r="620" fill="url(#crn-h-halo)"/>
  <rect width="1920" height="1080" fill="url(#crn-h-vignette)"/>
  <!-- mark, 640 px, centred at (560, 540) -->
  <g transform="translate(240 220) scale(3.2)">
    {{MARK}}
  </g>
  <!-- wordmark block -->
  <g filter="url(#crn-h-text)">
    <text x="1000" y="500" font-family="Cinzel, 'Palatino Linotype', Georgia, serif" font-size="150" letter-spacing="14" fill="#D6AC40">CORONET</text>
  </g>
  <text x="1006" y="590" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="60" letter-spacing="16" fill="#5CC8DC">{{SUBTITLE}}</text>
  <line x1="1006" y1="640" x2="1500" y2="640" stroke="#D6AC40" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="1006" y="700" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="36" fill="#A9AFC3">{{TAGLINE}}</text>
  <text x="1860" y="1030" text-anchor="end" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="28" letter-spacing="2" fill="#A9AFC3">STELLARIS {{VERSION}}</text>
</svg>
